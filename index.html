<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laundry Services - Hero Section</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar Section: Logo on left, links in middle, username on right (No Flex) -->
     <header class="navbar">
        <div class="nav-left">
            <span class="logo">Logo</span>
        </div>
        <div class="nav-links">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Contact Us</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <span class="username-badge">Username</span>
        </div>
        </header>

        <!-- Hero Section: Two divs, uses viewport units to fit screen without scroll -->
         <section class="Hero-section">
            <div class="hero-left">
                <h1>Revitalize Your Clothes with Expert <span class="highlight">Laundry Services!</span></h1>
                <p>Experience hassle-free laundry care with quick pickup, expert cleaning, and prompt delivery right to your doorstep.</p>
                <button class="btn">Book a Service Today</button>

            </div>
            <div class="hero-right">
                <img src="https://images.unsplash.com/photo-1545173168-9f1947eebb7f?auto=format&fit=crop&w=600&q=80" alt="Laundry Service">
            </div>
         </section>

     

    
</body>
</html>
